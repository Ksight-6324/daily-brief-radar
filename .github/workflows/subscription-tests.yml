name: Subscription tests

on:
  push:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'requirements*.txt'
      - '.github/workflows/subscription-tests.yml'
  pull_request:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'requirements*.txt'
      - '.github/workflows/subscription-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
