name: Subscription tests

on:
  push:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'fetchers/fetch_category_news.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/subscription-tests.yml'
  pull_request:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'fetchers/fetch_category_news.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/subscription-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - name: Validate deployment configuration
        run: |
          cp .env.example .env
          DOMAIN=brief.example.com docker compose config --quiet
          docker run --rm -e DOMAIN=brief.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
