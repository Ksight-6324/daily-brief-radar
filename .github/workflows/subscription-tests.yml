name: Subscription tests

on:
  push:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'newsletter.py'
      - 'compose.museletter.yml'
      - 'fetchers/fetch_category_news.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/subscription-tests.yml'
  pull_request:
    paths:
      - 'subscription/**'
      - 'web/**'
      - 'tests/**'
      - 'run_all.py'
      - 'newsletter.py'
      - 'compose.museletter.yml'
      - 'fetchers/fetch_category_news.py'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'deploy/**'
      - '.github/workflows/subscription-tests.yml'

permissions:
  contents: read

jobs:
  test:
    # Pinned: the deployment check below needs the Docker CLI and Compose plugin, which this image ships.
    # ubuntu-latest moved to Ubuntu 26 in October 2026 and the check failed there with "command not found".
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - name: Validate deployment configuration
        run: |
          docker --version
          docker compose version
          cp .env.example .env
          export DOMAIN=brief.example.com
          docker compose config --format json > /tmp/brief-compose.json
          docker compose -f compose.museletter.yml config --format json > /tmp/museletter-compose.json
          python - <<'PY'
          import json
          from pathlib import Path

          services = json.loads(Path('/tmp/brief-compose.json').read_text())['services']
          expected = {'BRIEF_DB_PATH': '/data/brief.db', 'BRIEF_SEEN_FILE': '/data/seen_items.json',
                      'BRIEF_BACKUP_DIR': '/backups'}
          for name in ('api', 'worker', 'scheduler', 'maintenance'):
              assert all(services[name]['environment'][key] == value for key, value in expected.items()), name
          assert services['api']['environment']['FORWARDED_ALLOW_IPS'] == '*'
          assert not services['api'].get('ports')
          assert '--ping' in services['worker']['healthcheck']['test']
          light = json.loads(Path('/tmp/museletter-compose.json').read_text())['services']
          assert set(light) == {'museletter', 'publisher'}
          assert light['museletter']['ports'][0]['host_ip'] == '127.0.0.1'
          assert '--no-access-log' in light['museletter']['command']
          assert light['publisher']['environment']['BRIEF_MODE'] == 'museletter'
          PY
          docker run --rm -e DOMAIN=brief.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2 adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null
