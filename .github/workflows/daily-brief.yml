name: 每日AI简报

on:
  schedule:
    # 注意：GitHub Actions 的 cron 是 UTC 时间，北京时间 = UTC + 8
    # 每天北京时间早上 07:30（UTC 前一天 23:30）运行一次。
    - cron: '30 23 * * *'
  workflow_dispatch:        # 允许你在 GitHub 网页上手动点按钮触发，方便测试

jobs:
  run-brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行早间简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
          SEND_TO: ${{ secrets.SEND_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PROFILE_TEXT: ${{ secrets.USER_PROFILE_TEXT }}
        run: python run_all.py
